# The Android app (android/, docs/dev/android.md): the JVM unit tests and an
# unsigned release build of what a release ships (64-bit ARM), and on an
# emulator the device tests, among them the embedded server's start
# (LocalServerStartTest: /api/health, then a PDF uploaded and a page
# picture asked for, which only PyMuPDF draws), so a broken Python bundle
# fails here and not on a phone. No signing, no upload: the release build
# is desktop.yml's android job. The app carries the server and its mobile
# pins, the built web app and the desktop app's chrome pages (desktop/ui/),
# so a change to the server's dependencies or to those pages starts this
# workflow too; the code itself is what the other checks test. The two ink
# fixtures the Kotlin pen ports are held to (tests/shared/inkwidth.json,
# inkhold.json) start it as well.
# Overview: docs/dev/github_actions.md.

name: android

on:
  pull_request:
    paths:
      - "android/**"
      - "backend/gamma_mobile.py"
      - "backend/requirements.txt"
      - "backend/requirements-mobile.txt"
      - "tests/shared/inkwidth.json"
      - "tests/shared/inkhold.json"
      - "desktop/ui/**"
      - "tools/build_frontend_if_needed.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      # Chaquopy's pip runs under the app's Python version, which it finds
      # on PATH (python3.13).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # Through bash: gradlew's executable bit does not survive a commit
      # from Windows.
      - name: Unit tests
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest -Pgamma.abis=arm64-v8a -Pgamma.webBuild=prebuilt
      - name: Release build (unsigned, 64-bit ARM)
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleRelease -Pgamma.abis=arm64-v8a -Pgamma.webBuild=prebuilt
      # Google Play takes only native libraries aligned to 16 KB pages.
      - name: 16 KB alignment
        run: |
          apks=(android/app/build/outputs/apk/release/*.apk)
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          if ! "$bt/zipalign" -c -P 16 -v 4 "${apks[0]}" > zipalign.log; then
            tail -40 zipalign.log
            echo "::error::${apks[0]} is not aligned for 16 KB pages"
            exit 1
          fi
          tail -1 zipalign.log
          ls -la "${apks[0]}"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # The device tests on an x86_64 emulator (the app built for that ABI
  # alone: its Python packages are per ABI). The server's log and logcat
  # are kept for a failure, read while the emulator still runs, since the
  # runner shuts it down when its script ends.
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # Built before the emulator starts, so it does not idle through the
      # compile.
      - name: Build the app and its device tests
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -Pgamma.abis=x86_64 -Pgamma.webBuild=prebuilt
      # The emulator needs hardware acceleration, which the runner's KVM
      # gives only once its device is open to the runner's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner runs each script line in its own shell. The apps stay
      # installed after the run (AGP removes them otherwise), so the
      # server's log can still be read from the app's files.
      - name: Device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            mkdir -p "$RUNNER_TEMP/emulator"
            adb logcat -c
            bash ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pgamma.abis=x86_64 -Pgamma.webBuild=prebuilt -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch "$RUNNER_TEMP/emulator/failed"
            # The device test's server keeps its data in the cache (LocalServerStartTest), the app's in files.
            adb exec-out run-as com.gammapdf.gamma cat cache/start-test/Gamma/local/logs/server.log > "$RUNNER_TEMP/emulator/server.log" || true
            adb exec-out run-as com.gammapdf.gamma cat files/Gamma/local/logs/server.log > "$RUNNER_TEMP/emulator/app-server.log" || true
            adb logcat -d > "$RUNNER_TEMP/emulator/logcat.txt" || true
            test ! -e "$RUNNER_TEMP/emulator/failed"
      # The embedded server's own log, where a failed start's traceback is
      # (backend/gamma_mobile.py), beside what the test report says.
      - name: The server's log from the emulator
        if: failure()
        run: |
          echo "== the device test's server.log"
          tail -c 20000 "$RUNNER_TEMP/emulator/server.log" 2>/dev/null || echo "(none)"
          echo "== the app's own server.log"
          tail -c 5000 "$RUNNER_TEMP/emulator/app-server.log" 2>/dev/null || echo "(none)"
          echo "== logcat around a Python failure"
          grep -n -i -B3 -A30 "Traceback\|gamma_mobile\|python\.\|AndroidRuntime" "$RUNNER_TEMP/emulator/logcat.txt" 2>/dev/null | tail -200 || true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-failures
          path: |
            ${{ runner.temp }}/emulator/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
