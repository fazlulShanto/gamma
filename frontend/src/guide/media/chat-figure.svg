<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- Ask the paper about a figure. With the area key held (the card
       names it, so no cap is drawn), the pointer drags a box from above
       the figure's left corner to just over its caption, the box's two
       sides drawn at the pointer's pace. On release the region joins the
       question in the composer as a thumbnail, and the question is typed
       after it. Send: the box on the page goes, the question posts with
       its picture, and the answer arrives as prose with a citation pill
       for the page it read. The accent is the box while it is drawn, then
       the citation (PdfViewer's area drag, guide/previewArea.js figureBox,
       ChatDock's chatImgPreviewRow and chatMsgImages, CitationPill). -->

  <!-- the paper: a paragraph, the figure and its caption, more text -->
  <rect class="m-well" x="12" y="12" width="168" height="176" rx="6" />
  <rect class="m-card" x="24" y="20" width="144" height="160" rx="2" />
  <rect class="m-line" x="36" y="30" width="72" height="5" rx="2.5" />
  <rect class="m-line-dim" x="36" y="42" width="120" height="3" rx="1.5" />
  <rect class="m-line-dim" x="36" y="49" width="116" height="3" rx="1.5" />
  <rect class="m-line-dim" x="36" y="56" width="120" height="3" rx="1.5" />
  <rect class="m-line-dim" x="36" y="63" width="120" height="3" rx="1.5" />
  <rect class="m-line-dim" x="36" y="70" width="84" height="3" rx="1.5" />
  <rect class="m-well" x="52" y="84" width="88" height="46" rx="2" />
  <path class="m-glyph" d="M60 120L74 108L88 113L104 98L120 103L132 92" />
  <rect class="m-line-dim" x="52" y="136" width="60" height="3" rx="1.5" />
  <rect class="m-line-dim" x="36" y="148" width="120" height="3" rx="1.5" />
  <rect class="m-line-dim" x="36" y="155" width="116" height="3" rx="1.5" />
  <rect class="m-line-dim" x="36" y="162" width="120" height="3" rx="1.5" />
  <rect class="m-line-dim" x="36" y="169" width="90" height="3" rx="1.5" />

  <!-- the box, gone once the question is sent -->
  <g class="m-leave" style="--m-at: 0.4">
    <path class="m-link m-draw m-quick" pathLength="1" style="--m-at: 0.15" d="M44 78H148V138" />
    <path class="m-link m-draw m-quick" pathLength="1" style="--m-at: 0.15" d="M44 78V138H148" />
  </g>

  <!-- Chat: its title row; the question with its picture, then the answer -->
  <rect class="m-card" x="188" y="12" width="120" height="176" rx="6" />
  <path class="m-glyph" d="M195 18h.01M198 18h.01M195 21h.01M198 21h.01M195 24h.01M198 24h.01" />
  <rect class="m-line" x="204" y="19" width="24" height="4" rx="2" />
  <path class="m-rule" d="M188 30H308" />
  <g class="m-appear" style="--m-at: 0.58">
    <rect class="m-chip" x="236" y="38" width="64" height="40" rx="8" />
    <rect class="m-well" x="242" y="44" width="26" height="18" rx="2" />
    <path class="m-glyph" d="M246 58L250 53L254 55L259 49L264 51" />
    <rect class="m-line" x="242" y="68" width="50" height="3" rx="1.5" />
  </g>
  <g class="m-appear" style="--m-at: 0.62">
    <rect class="m-line-dim" x="196" y="88" width="104" height="3" rx="1.5" />
    <rect class="m-line-dim" x="196" y="95" width="98" height="3" rx="1.5" />
    <rect class="m-line-dim" x="196" y="102" width="58" height="3" rx="1.5" />
    <rect class="m-chip-on" x="258" y="99.5" width="24" height="8" rx="4" />
    <rect class="m-line-dim" x="196" y="114" width="100" height="3" rx="1.5" />
    <rect class="m-line-dim" x="196" y="121" width="70" height="3" rx="1.5" />
  </g>

  <!-- the composer: + and Send, the placeholder until the question is typed -->
  <rect class="m-chip" x="196" y="134" width="104" height="46" rx="8" />
  <rect class="m-line-dim m-leave" style="--m-at: 0.3" x="214" y="166.5" width="56" height="3" rx="1.5" />
  <path class="m-glyph" d="M201 168H207M204 165V171" />
  <circle class="m-chip" cx="291" cy="168" r="6" />
  <circle class="m-chip-on m-light" style="--m-at: 0.54" cx="291" cy="168" r="6" />
  <path class="m-glyph" d="M291 171V165M288.5 167.5L291 165L293.5 167.5" />
  <g class="m-leave" style="--m-at: 0.58">
    <g class="m-appear" style="--m-at: 0.28">
      <rect class="m-well" x="204" y="140" width="26" height="18" rx="3" />
      <path class="m-glyph" d="M208 154L212 149L216 151L221 145L226 147" />
    </g>
    <path class="m-text m-draw" pathLength="1" style="--m-at: 0.32" d="M214 168H270" />
  </g>

  <!-- the hand: the box's corner, across the figure, then Send -->
  <circle class="m-ripple m-press" style="--m-at: 0.13" cx="44" cy="78" r="7" />
  <circle class="m-ripple m-press" style="--m-at: 0.55" cx="291" cy="168" r="7" />
  <g class="m-move" style="--m-at: 0.44; --m-dx: -143; --m-dy: -30">
    <g class="m-move" style="--m-at: 0.15; --m-dx: -104; --m-dy: -60">
      <g class="m-move" style="--m-at: 0.02; --m-dx: 66; --m-dy: 98">
        <g transform="translate(289.76 166.76) scale(0.62)">
          <path class="m-pointer" d="M2 2 L2 20 L7 15.5 L10.5 23 L14 21.5 L10.5 14 L17 14 Z" />
        </g>
      </g>
    </g>
  </g>
</svg>
