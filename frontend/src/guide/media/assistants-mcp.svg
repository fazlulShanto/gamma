<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- Gamma is an MCP server: a coding agent's terminal, left, laid out the
       way Codex lays out its session: a header box with the >_ mark, the
       question after the › prompt, each tool call as a dot, the call and
       its tool's name with its result under a └, then the answer, and the
       input box at the bottom. The two calls are Gamma's tools (the accent
       names): one searches the library, the other reads the page, and as it
       reads, the passage is marked on the page in Gamma, right, across the
       link between them. The answer ends in a citation of that page
       (docs/dev/mcp.md; docs/user_guide/user_guide.md, "Assistants"). -->

  <!-- the terminal: its title dots, the session's header box -->
  <rect class="m-card" x="12" y="12" width="196" height="176" rx="8" />
  <circle class="m-line-dim" cx="22" cy="21" r="2" />
  <circle class="m-line-dim" cx="29" cy="21" r="2" />
  <circle class="m-line-dim" cx="36" cy="21" r="2" />
  <path class="m-rule" d="M12 30H208" />
  <rect class="m-rule" x="22" y="38" width="104" height="28" rx="4" />
  <path class="m-glyph-on" d="M29 44.5L32 47L29 49.5M34 50H39" />
  <rect class="m-line" x="44" y="45.5" width="44" height="3" rx="1.5" />
  <rect class="m-line-dim" x="29" y="56.5" width="76" height="3" rx="1.5" />

  <!-- the question, typed after the prompt -->
  <path class="m-glyph-on" d="M23 77L26 80L23 83" />
  <path class="m-text m-draw" pathLength="1" style="--m-at: 0.04" d="M33 80H150" />

  <!-- the two tool calls, each with its result -->
  <g class="m-appear" style="--m-at: 0.22">
    <circle class="m-chip-on" cx="25" cy="96" r="2" />
    <rect class="m-line" x="32" y="94.5" width="22" height="3" rx="1.5" />
    <rect class="m-chip-on" x="58" y="92" width="46" height="8" rx="4" />
    <rect class="m-line-dim" x="108" y="94.5" width="46" height="3" rx="1.5" />
  </g>
  <g class="m-appear" style="--m-at: 0.28">
    <path class="m-glyph" d="M33 100.5V105H38" />
    <rect class="m-line-dim" x="42" y="103.5" width="80" height="3" rx="1.5" />
  </g>
  <g class="m-appear" style="--m-at: 0.36">
    <circle class="m-chip-on" cx="25" cy="116" r="2" />
    <rect class="m-line" x="32" y="114.5" width="22" height="3" rx="1.5" />
    <rect class="m-chip-on" x="58" y="112" width="40" height="8" rx="4" />
    <rect class="m-line-dim" x="102" y="114.5" width="54" height="3" rx="1.5" />
  </g>
  <g class="m-appear" style="--m-at: 0.42">
    <path class="m-glyph" d="M33 120.5V125H38" />
    <rect class="m-line-dim" x="42" y="123.5" width="100" height="3" rx="1.5" />
  </g>

  <!-- the answer, citing the page -->
  <g class="m-appear" style="--m-at: 0.52">
    <circle class="m-line" cx="25" cy="138" r="2" />
    <rect class="m-line" x="32" y="136.5" width="160" height="3" rx="1.5" />
    <rect class="m-line" x="32" y="144.5" width="150" height="3" rx="1.5" />
    <rect class="m-line" x="32" y="152.5" width="84" height="3" rx="1.5" />
  </g>
  <rect class="m-chip-on m-light" style="--m-at: 0.6" x="120" y="151" width="22" height="6" rx="3" />

  <!-- the input box -->
  <rect class="m-rule" x="22" y="164" width="176" height="16" rx="4" />
  <path class="m-glyph" d="M29 169L32 172L29 175" />
  <rect class="m-line-dim" x="38" y="170.5" width="60" height="3" rx="1.5" />

  <!-- Gamma: the page the second call reads, its passage marked -->
  <rect class="m-well" x="216" y="12" width="92" height="176" rx="6" />
  <rect class="m-chip-on" x="224" y="20" width="10" height="10" rx="3" />
  <rect class="m-line" x="238" y="23" width="30" height="4" rx="2" />
  <rect class="m-card" x="224" y="36" width="76" height="144" rx="2" />
  <rect class="m-line" x="232" y="46" width="50" height="4" rx="2" />
  <rect class="m-line-dim" x="232" y="56" width="60" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="63" width="56" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="70" width="60" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="77" width="40" height="3" rx="1.5" />
  <rect class="m-well" x="232" y="88" width="60" height="26" rx="2" />
  <rect class="m-line-dim" x="232" y="124" width="60" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="131" width="58" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="138" width="60" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="145" width="50" height="3" rx="1.5" />
  <rect class="m-line-dim" x="232" y="152" width="60" height="3" rx="1.5" />
  <path class="m-mark m-draw" pathLength="1" style="--m-at: 0.42" d="M232 132.5H290M232 139.5H262" />

  <!-- the MCP link between them, lit from the first call -->
  <path class="m-link m-light" style="--m-at: 0.22" d="M208 100H216" />
  <circle class="m-chip-on m-light" style="--m-at: 0.22" cx="212" cy="100" r="3.5" />
</svg>
